<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osama💻</title>
    <style>
        @property --mx {
            syntax: '<percentage>';
            inherits: true;
            initial-value: 25%;
        }
        @property --my {
            syntax: '<percentage>';
            inherits: true;
            initial-value: 0%;
        }

        :root {
            --primary-color: #4F46E5;
            --card-bg: rgba(15, 23, 42, 0.05);
            --card-border: rgba(255, 255, 255, 0.22);
            --card-shadow: 0 24px 70px rgba(0, 0, 0, 0.45), 0 2px 10px rgba(0, 0, 0, 0.25);
            --body-bg: #0f172a;
            --name-color: #f1f5f9;
            --desc-color: #cbd5e1;
            --profile-border: rgba(255, 255, 255, 0.5);
            --img-placeholder: rgba(255,255,255,0.1);
            --wave-fill: rgba(15, 23, 42, 0.4);
            --toggle-bg: rgba(255,255,255,0.08);
            --toggle-border: rgba(255,255,255,0.22);
            --toggle-color: #e2e8f0;

            --specular-opacity: 0.16;
            --btn-glass-bg: rgba(255,255,255,0.03);
            --btn-glass-border: rgba(255,255,255,0.22);
            --btn-text-accent: #e0e7ff;
        }

        [data-theme="light"] {
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.3);
            --card-shadow: 0 24px 60px rgba(79, 70, 229, 0.18), 0 2px 8px rgba(79, 70, 229, 0.1);
            --body-bg: #c7d2fe;
            --name-color: #1e1b4b;
            --desc-color: #4B5563;
            --profile-border: rgba(255, 255, 255, 0.95);
            --img-placeholder: #ede9fe;
            --wave-fill: rgba(255, 255, 255, 0.35);
            --toggle-bg: rgba(255,255,255,0.08);
            --toggle-border: rgba(255,255,255,0.3);
            --toggle-color: #3730a3;

            --specular-opacity: 0.14;
            --btn-glass-bg: rgba(255,255,255,0.05);
            --btn-glass-border: rgba(255,255,255,0.32);
            --btn-text-accent: #4338ca;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0; padding: 0;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
            background-color: var(--body-bg);
            transition: background-color 0.4s ease;
        }

        canvas#particles {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
        }

        /* ---------- Theme toggle (liquid glass pill) ---------- */
        .theme-toggle {
            position: fixed; top: 18px; right: 18px; z-index: 100;
            background: var(--toggle-bg);
            border: 1px solid var(--toggle-border);
            border-radius: 50px;
            padding: 8px 14px;
            cursor: pointer;
            display: flex; align-items: center; gap: 7px;
            font-size: 0.78rem; font-weight: 600;
            color: var(--toggle-color);
            backdrop-filter: blur(6px) saturate(130%);
            -webkit-backdrop-filter: blur(6px) saturate(130%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 6px 16px rgba(0,0,0,0.1);
            transition: background 0.35s ease, border 0.3s, color 0.3s, transform 0.15s, box-shadow 0.25s;
            user-select: none;
        }
        .theme-toggle:hover  { transform: scale(1.05); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 20px rgba(0,0,0,0.14); }
        .theme-toggle:active { transform: scale(0.96); }
        .theme-toggle .icon  { display: flex; align-items: center; line-height: 1; }
        .theme-toggle .icon svg { width: 14px; height: 14px; display: block; }

        /* ---------- Card ---------- */
        .card {
            position: relative;
            z-index: 10;
            width: 90%; max-width: 380px;
            text-align: center;
            border-radius: 28px;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow), inset 0 1px 0 rgba(255,255,255,0.2), inset 0 -14px 24px -20px rgba(0,0,0,0.2);
            transition: box-shadow 0.4s, border-color 0.4s;
        }

        /* The frosted glass + dynamic specular highlight lives on ::before
           so overflow:hidden on children never clips the blur */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 28px;
            background:
                radial-gradient(560px circle at var(--mx,20%) var(--my,-10%), rgba(255,255,255,var(--specular-opacity)), transparent 60%),
                var(--card-bg);
            backdrop-filter: blur(6px) saturate(130%);
            -webkit-backdrop-filter: blur(6px) saturate(130%);
            z-index: 0;
            transition: background 0.4s;
        }

        /* Every direct child of card needs z-index > 0 to sit above ::before */
        .svg-header, .profile-content {
            position: relative;
            z-index: 1;
        }

        .svg-header {
            background:
                linear-gradient(160deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 55%),
                var(--primary-color);
            height: 130px;
            border-radius: 28px 28px 0 0;
            overflow: hidden;
        }
        .svg-header svg {
            position: absolute; bottom: -1px; left: 0;
            width: 100%; height: 60px;
        }
        .svg-header svg path {
            fill: var(--wave-fill);
            transition: fill 0.4s;
        }

        .profile-content { padding: 0 24px 32px; }

        .profile-img {
            width: 110px; height: 110px;
            border-radius: 50%; object-fit: cover;
            margin: -55px auto 16px;
            position: relative; z-index: 2;
            border: 4px solid var(--profile-border);
            display: block;
            background-color: var(--img-placeholder);
            box-shadow: 0 0 0 4px rgba(255,255,255,0.12), 0 4px 20px rgba(0,0,0,0.25);
            transition: border-color 0.4s;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.5rem; font-weight: 700;
            color: var(--name-color);
            transition: color 0.4s;
        }
        p {
            color: var(--desc-color);
            margin: 0 0 24px; font-size: 0.95rem; line-height: 1.4;
            transition: color 0.4s;
        }

        .links { display: flex; flex-direction: column; gap: 12px; }

        /* ---------- Liquid glass buttons ---------- */
        .link-btn {
            position: relative;
            display: flex; align-items: center; justify-content: center;
            gap: 10px; padding: 13px; border-radius: 14px;
            text-decoration: none; font-weight: 600; font-size: 0.95rem;
            border: 1px solid var(--btn-glass-border);
            backdrop-filter: blur(5px) saturate(120%);
            -webkit-backdrop-filter: blur(5px) saturate(120%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 6px 16px rgba(0,0,0,0.08);
            transition: transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s, background 0.35s;
        }
        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 10px 22px rgba(0,0,0,0.14);
        }
        .link-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .email-btn, .cv-en-btn, .cv-tr-btn, .cv-ar-btn {
            background: var(--btn-glass-bg);
            color: var(--btn-text-accent);
        }

        .linkedin-btn {
            background: rgba(10, 102, 194, 0.38);
            color: #ffffff;
            border-color: rgba(255,255,255,0.35);
        }

        .cv-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .cv-container .link-btn { padding: 11px 4px; font-size: 0.82rem; gap: 5px; }
        .cv-container .link-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

        @media (prefers-reduced-motion: reduce) {
            .link-btn, .theme-toggle, .card {
                transition: none !important;
            }
            .link-btn:hover, .theme-toggle:hover {
                transform: none !important;
            }
        }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="icon" id="themeIcon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>

    <div class="card">

        <div class="profile-content">

            <div class="links">

                            <polyline points="14 2 14 8 20 8"></polyline>

                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>

                        <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>

    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let W, H;
        function syncCanvasSize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        syncCanvasSize();
        window.addEventListener('resize', syncCanvasSize);
        window.addEventListener('load', syncCanvasSize);
        // Catches late layout/viewport changes in embedded or resized preview panes
        setTimeout(syncCanvasSize, 300);

        const PARTICLE_COUNT = 120;
        const CONNECTION_DIST = 130;
        const dotColors = ['#4F46E5', '#818cf8', '#38bdf8', '#6366f1'];

        const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
            x: Math.random() * W, y: Math.random() * H,
            vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
            r: Math.random() * 2.5 + 1,
            color: dotColors[Math.floor(Math.random() * dotColors.length)],
            alpha: Math.random() * 0.5 + 0.3
        }));

        let isLight = true;

        function draw() {
            ctx.clearRect(0, 0, W, H);
            const lineRGB = isLight ? '79,70,229' : '99,102,241';
            const lineOpacity = isLight ? 0.32 : 0.25;
            const alphaMult  = isLight ? 1 : 1;

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONNECTION_DIST) {
                        const op = (1 - dist / CONNECTION_DIST) * lineOpacity;
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(${lineRGB}, ${op})`;
                        ctx.lineWidth = 0.8;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            for (const p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                const alphaHex = Math.round(p.alpha * alphaMult * 255).toString(16).padStart(2, '0');
                ctx.fillStyle = p.color + alphaHex;
                ctx.fill();
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > W) p.vx *= -1;
                if (p.y < 0 || p.y > H) p.vy *= -1;
            }
            requestAnimationFrame(draw);
        }
        draw();

        const html       = document.documentElement;
        const toggleBtn  = document.getElementById('themeToggle');
        const themeIcon  = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');

        const moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
        const sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';

        toggleBtn.addEventListener('click', () => {
            isLight = !isLight;
            html.setAttribute('data-theme', isLight ? 'light' : 'dark');
            themeIcon.innerHTML   = isLight ? moonIcon : sunIcon;
            themeLabel.textContent = isLight ? 'Dark' : 'Light';
        });

        /* ---------- Liquid Glass: pointer-tracked specular highlight (single light, on the card only) ---------- */
        const prefersFinePointer = window.matchMedia('(pointer: fine)').matches;
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (prefersFinePointer && !prefersReducedMotion) {
            const card = document.querySelector('.card');
            card.addEventListener('pointermove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                card.style.setProperty('--mx', x + '%');
                card.style.setProperty('--my', y + '%');
            });
            card.addEventListener('pointerleave', () => {
                card.style.removeProperty('--mx');
                card.style.removeProperty('--my');
            });
        }
    </script>
</body>
